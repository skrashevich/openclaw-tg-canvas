        </div>
      </header>

      <main id="content" class="content" role="main">
        <div class="content-inner">
          <!-- Dynamic content rendered here -->
        </div>
      </main>

      <!-- Sessions overlay — list + chat views -->
      <div id="sessions-pane" class="sessions-pane" aria-label="Sessions">
        <div id="sessions-root" class="sessions-root">
          <header id="sessions-header" class="sessions-header">
            <button id="sessionsBackBtn" type="button" class="sessions-icon-btn" aria-label="Back">✕</button>
            <div id="sessionsHeaderTitle" class="sessions-header-title">Sessions</div>
            <button id="sessionsRefreshBtn" type="button" class="sessions-icon-btn" aria-label="Refresh">↻</button>
          </header>
          <div id="sessions-list-view" class="sessions-list-view">
            <div id="sessionsPullHint" class="sessions-pull-hint">Pull down to refresh</div>
            <div id="sessionsListScroll" class="sessions-list-scroll">
              <ul id="sessionsList" class="sessions-list"></ul>
            </div>
          </div>
          <div id="sessions-chat-view" class="sessions-chat-view" hidden>
            <div id="sessionsMessages" class="sessions-messages" role="log" aria-live="polite"></div>
            <form id="sessionsComposer" class="sessions-composer" autocomplete="off">
              <textarea id="sessionsInput" class="sessions-input" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
              <button id="sessionsSendBtn" type="submit" class="sessions-send-btn">Send</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Terminal overlay — sits on top of canvas, canvas state preserved underneath -->
      <div id="terminal-pane" class="terminal-pane" style="display:none" aria-label="Terminal">
        <div class="terminal-topbar">
          <span class="terminal-topbar-title">Terminal</span>
          <button id="closeTerminalBtn" class="terminal-close-btn" aria-label="Close terminal">✕</button>
        </div>
        <div id="terminal-container"></div>
      </div>
    </div>

    <script>
      // Ensure Telegram WebApp is ready and expanded to full height
      if (window.Telegram && window.Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <script src="/miniapp/i18n.js"></script>
    <script src="/miniapp/app.js"></script>
  </body>
</html>
